version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-major:
        patterns: ["*"]
        update-types: ["major"]
      github-actions-minor:
        patterns: ["*"]
        update-types: ["minor"]
      github-actions-patch:
        patterns: ["*"]
        update-types: ["patch"]
