name: Production Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install clang and cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1.1.2

      - name: Install AVR Board Platform
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Set up Python for PlatformIO
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Configure CMake for Desktop
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Desktop Application
        run: cmake --build build --target somnia-cli

      - name: Bundle Core to Flat Sketch Layout
        run: |
          cp core/include/PatternEngine.hpp firmware/
          cp core/include/ScaleEngine.hpp firmware/
          cp core/include/SequenceEngine.hpp firmware/
          cp core/include/SomniaCompat.hpp firmware/
          cp core/include/AudioOutput.hpp firmware/
          cp core/src/PatternEngine.cpp firmware/
          cp core/src/ScaleEngine.cpp firmware/
          cp core/src/SequenceEngine.cpp firmware/
          rm -f firmware/ExportEngine.* firmware/MidiEngine.* firmware/WavEngine.*

      - name: Cross-Compile AVR Bare-Metal Targets
        run: |
          mkdir release-assets
          arduino-cli compile --fqbn arduino:avr:nano --output-dir release-assets firmware/

      - name: Cross-Compile ESP32 & Raspberry Pi Pico Targets
        run: |
          pio run -d firmware -e esp32 -e pico
          cp firmware/.pio/build/esp32/firmware.bin release-assets/somnia-firmware-esp32.bin
          cp firmware/.pio/build/esp32/firmware.elf release-assets/somnia-firmware-esp32.elf
          if [ -f firmware/.pio/build/pico/firmware.uf2 ]; then
            cp firmware/.pio/build/pico/firmware.uf2 release-assets/somnia-firmware-pico.uf2
          fi
          if [ -f firmware/.pio/build/pico/firmware.bin ]; then
            cp firmware/.pio/build/pico/firmware.bin release-assets/somnia-firmware-pico.bin
          fi
          cp firmware/.pio/build/pico/firmware.elf release-assets/somnia-firmware-pico.elf

      - name: Package Desktop Artifacts
        run: |
          cp build/cli/somnia-cli release-assets/somnia-cli-linux-x86_64

      - name: Deploy GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

