name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  desktop-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake clang-format

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Run Full Quality Gate (Format, Lint, Typecheck, Test)
        run: just check

      - name: Run Telemetry Validation
        run: just run "-n 16 --format raw"

  firmware-cross-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1.1.2

      - name: Install AVR Board Platform
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Bundle Core to Flat Sketch Layout
        run: just sync-firmware

      - name: Cross-Compile Sketch for Arduino Nano & Uno with Memory Footprint Audit
        run: |
          arduino-cli compile --fqbn arduino:avr:nano --output-dir /tmp/nano_build firmware/
          arduino-cli compile --fqbn arduino:avr:uno --output-dir /tmp/uno_build firmware/
