name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate commit messages
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commit-range.sh "$BASE" "$HEAD"

  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install just
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just@1.58.0
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake clang-format actionlint shellcheck shfmt
      - run: just install
      - run: just check
      - name: Check version consistency
        run: python3 scripts/check-versions.py

  arduino:
    name: Arduino Library & Sketches
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db # v2.1.0
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Compile firmware sketch (Nano)
        run: arduino-cli compile --fqbn arduino:avr:nano --library firmware/ firmware/firmware.ino
      - name: Compile firmware sketch (Uno)
        run: arduino-cli compile --fqbn arduino:avr:uno --library firmware/ firmware/firmware.ino
      - name: Compile reference examples
        run: |
          arduino-cli compile --fqbn arduino:avr:nano --library firmware/ firmware/examples/01_piezo_buzzer/01_piezo_buzzer.ino
          arduino-cli compile --fqbn arduino:avr:nano --library firmware/ firmware/examples/02_usb_midi_player/02_usb_midi_player.ino
          arduino-cli compile --fqbn arduino:avr:nano --library firmware/ firmware/examples/03_i2s_ambient/03_i2s_ambient.ino

  bindings:
    name: Language Bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install just
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just@1.58.0
      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Build C++ core shared library
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake
          just build
      - name: Test Python bindings
        run: PYTHONPATH=bindings/python python3 -m unittest discover -s bindings/python/tests
      - name: Test TypeScript bindings
        run: cd bindings/npm && bun test
