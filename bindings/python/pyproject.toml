[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "somnia-audio"
version = "0.6.0"
description = "Deterministic zero-allocation procedural audio generator and ambient synthesizer core"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Core Red Project", email = "houjou.sxnnyside@sxnnysideproject.com" }
]
keywords = ["audio", "procedural", "synth", "music", "midi", "ambient", "generative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/core-red-project/somnia"
Repository = "https://github.com/core-red-project/somnia"
Issues = "https://github.com/core-red-project/somnia/issues"
Changelog = "https://github.com/core-red-project/somnia/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["somnia"]

[tool.hatch.build.targets.wheel.force-include]
"somnia/*.so" = "somnia/"
"somnia/*.dylib" = "somnia/"
"somnia/*.dll" = "somnia/"

[tool.hatch.build.targets.sdist]
include = [
    "somnia/*.py",
    "README.md",
]
